name: Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate metrics.svg
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: AdrianSilvadoNascimento
          template: classic
          config_timezone: America/Sao_Paulo

          # Sections
          base: header, activity, community, repositories

          # Languages
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: programming, markup
          plugin_languages_recent_categories: programming, markup
          plugin_languages_recent_days: 14
          plugin_languages_limit: 8

          # Achievements plugin disabled for now: broken upstream because its
          # GraphQL query still references "Projects (classic)", which GitHub
          # sunset. See https://github.com/lowlighter/metrics/discussions/1841
          # plugin_achievements: yes
          # plugin_achievements_display: compact
          # plugin_achievements_threshold: C
